name: Build APK
'on': [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar estructura del proyecto Android
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -d app/src/main/java/com/example/topobt
          grep -q "version '9.4.0' apply false" build.gradle || { echo "Falta la versión del plugin Android 9.4.0 en el build.gradle raíz. No reemplaces ese archivo por app/build.gradle."; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.1
      - name: Compilar APK debug
        run: gradle --stacktrace --no-daemon assembleDebug
      - name: Confirmar APK generado
        run: test -f app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TopoBT-apk-v1.9
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
